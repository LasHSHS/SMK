# Experimental macOS / Linux packages. NOT tested by the maintainer.
# Official releases remain Windows-only (see build_smk.ps1 / GitHub Releases).
name: Beta unix builds (untested)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta*"

jobs:
  linux-beta:
    name: Linux beta (untested)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps (Qt / WebEngine-ish)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 \
            libasound2 libatk-bridge2.0-0 libgtk-3-0
      - name: Beta build
        run: |
          chmod +x build_smk_unix.sh scripts/fetch_ffmpeg.sh
          ./build_smk_unix.sh
      - name: Zip artifact
        run: |
          cd dist
          mv smd "SMK-linux-x64-BETA-UNTESTED"
          zip -r "../SMK-linux-x64-BETA-UNTESTED.zip" "SMK-linux-x64-BETA-UNTESTED"
      - uses: actions/upload-artifact@v4
        with:
          name: SMK-linux-x64-BETA-UNTESTED
          path: SMK-linux-x64-BETA-UNTESTED.zip

  macos-beta:
    name: macOS beta (untested)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Beta build
        run: |
          chmod +x build_smk_unix.sh scripts/fetch_ffmpeg.sh
          ./build_smk_unix.sh
      - name: Zip artifact
        run: |
          cd dist
          mv smd "SMK-macos-arm64-BETA-UNTESTED"
          zip -r "../SMK-macos-arm64-BETA-UNTESTED.zip" "SMK-macos-arm64-BETA-UNTESTED"
      - uses: actions/upload-artifact@v4
        with:
          name: SMK-macos-arm64-BETA-UNTESTED
          path: SMK-macos-arm64-BETA-UNTESTED.zip
